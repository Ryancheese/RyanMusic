name: macOS DMG Package

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-13
            arch: x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP (Homebrew)
        run: |
          brew update
          brew install php
          php -v

      - name: Build app + DMG
        run: |
          chmod +x macos/build-app.sh
          ./macos/build-app.sh --bundle-php --dmg
          ls -lh dist/RyanMusic-mac-*.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RyanMusic-mac-${{ matrix.arch }}
          path: dist/RyanMusic-mac-*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RyanMusic-mac-*.dmg
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
