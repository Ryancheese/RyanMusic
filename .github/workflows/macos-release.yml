name: macOS DMG Package

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build-macos:
    # GitHub macos-13 (Intel) 队列经常长时间无 runner；在 Apple Silicon runner 上交叉编译 x64 DMG。
    # Intel Mac 也可直接下载 RyanMusic-mac-x64.dmg。
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        run: |
          cd web
          npm ci
          npm run build

      - name: Build app + DMG (Apple Silicon)
        run: |
          chmod +x macos/build-app.sh
          ./macos/build-app.sh --dmg
          ls -lh dist/RyanMusic-mac-arm64.dmg

      - name: Build app + DMG (Intel x64)
        run: |
          ./macos/build-app.sh --arch x64 --dmg
          ls -lh dist/RyanMusic-mac-x64.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RyanMusic-mac
          path: |
            dist/RyanMusic-mac-arm64.dmg
            dist/RyanMusic-mac-x64.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Publish DMG to public Releases repo
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          repository: Ryancheese/RyanMusic-Releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: RyanMusic ${{ github.ref_name }}
          files: |
            dist/RyanMusic-mac-arm64.dmg
            dist/RyanMusic-mac-x64.dmg
          append_body: true
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: true

      # 1.8.67 及更早客户端仍查源码仓 RyanMusic，需镜像安装包以便应用内更新
      - name: Mirror DMG to source repo (legacy updaters)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: RyanMusic ${{ github.ref_name }}
          files: |
            dist/RyanMusic-mac-arm64.dmg
            dist/RyanMusic-mac-x64.dmg
          append_body: true
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: true
