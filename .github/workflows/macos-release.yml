name: macOS DMG Package

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build-macos:
    # GitHub macos-13 (Intel) 队列经常长时间无 runner；当前优先提供 Apple Silicon DMG。
    # Intel Mac 可用 README 中的 install.sh 从源码安装。
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        run: |
          cd web
          npm ci
          npm run build

      - name: Install PHP (Homebrew)
        run: |
          brew update
          brew install php
          php -v

      - name: Build app + DMG
        run: |
          chmod +x macos/build-app.sh
          ./macos/build-app.sh --bundle-php --dmg
          ls -lh dist/RyanMusic-mac-*.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RyanMusic-mac-arm64
          path: dist/RyanMusic-mac-*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Publish DMG to public Releases repo
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          repository: Ryancheese/RyanMusic-Releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: RyanMusic ${{ github.ref_name }}
          files: dist/RyanMusic-mac-*.dmg
          append_body: true
          make_latest: true
          fail_on_unmatched_files: true
